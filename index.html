<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1215" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet" />

  <!-- Agent-build reveal: on the first load of a session, keep the page blank until
       the build starts (see src/agentBuild). Must match shouldAutoBuild() in engine.js. -->
  <script>
    (function () {
      var seen = false;
      try { seen = !!sessionStorage.getItem('tg-build-seen'); } catch (e) { }
      if (!seen && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('pre');
        // Safety net: never leave the page hidden if the app fails to start.
        setTimeout(function () { document.documentElement.classList.remove('pre'); }, 6000);
      }
    })();
  </script>
  <style>
    html.pre #root { opacity: 0; }
    html { background: #0b1215; }
  </style>

  <!-- Primary Meta Tags -->
  <title>Tanmay Ghosh - AI/ML Engineer | Computer Vision Specialist | Trinity College Dublin</title>
  <meta name="title" content="Tanmay Ghosh - AI/ML Engineer | Computer Vision Specialist" />
  <meta name="description"
    content="AI/ML Engineer and Computer Science MSc graduate of Trinity College Dublin, specializing in computer vision, LLMs, and intelligent systems. Experienced in YOLO, FastAPI, React, and production-grade ML solutions." />
  <meta name="keywords"
    content="AI Engineer, ML Engineer, Computer Vision, YOLO, FastAPI, React, Python, Deep Learning, Trinity College Dublin, Tanmay Ghosh, LLM, RAG, Computer Science" />
  <meta name="author" content="Tanmay Ghosh" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social Meta Tags -->
  <meta property="og:type" content="website" />

    content="AI/ML Engineer specializing in computer vision, LLMs, and intelligent systems. MSc graduate of Trinity College Dublin." />
  <meta property="og:image" content="https://ghoshnet.github.io/Tanmay-Portfolio/og-image.jpg" />

  <!-- Google Analytics 4 (Free) — Only loads if measurement ID is configured -->
  <script>
    // GA4 is loaded dynamically so it doesn't fire with a placeholder ID
    (function () {
      // Replace 'G-XXXXXXXXXX' with your actual GA4 Measurement ID in .env
      // To get one: https://analytics.google.com → Create Property → Get Measurement ID
      var GA_ID = 'G-XXXXXXXXXX'; // TODO: Replace with real ID
      if (GA_ID && GA_ID !== 'G-XXXXXXXXXX') {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
